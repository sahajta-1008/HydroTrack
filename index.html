
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroTrack 💧</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eaf6ff;color:#23415b}
.container{max-width:750px;margin:30px auto;padding:20px}
.card{background:white;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 4px 15px #c8ddeb}
h1{text-align:center;color:#168bd0}
h2{color:#168bd0}
input{padding:12px;border:1px solid #b9d5e8;border-radius:9px;width:100%;margin:7px 0;font-size:15px}
button{background:#168bd0;color:white;border:0;padding:12px 17px;border-radius:9px;margin:5px;cursor:pointer;font-size:15px}
button:hover{background:#0875b7}
.secondary{background:#6c91aa}
#app,#dashboard{display:none}
.progress{height:20px;background:#dcecf6;border-radius:20px;overflow:hidden}
#progressBar{height:100%;width:0;background:#21a4dc;transition:.3s}
#message{text-align:center;background:#eaf6ff;padding:15px;border-radius:12px;font-weight:bold}
#log p{border-bottom:1px solid #e5eef4;padding:7px}
.small{font-size:13px;color:#60798d}
</style>
</head>
<body>
<div class="container">
<h1>💧 HydroTrack</h1>

<div class="card" id="login">
<h2>Welcome to HydroTrack!</h2>
<p>Create an account or log in to track your water intake.</p>
<input id="name" placeholder="Your name (for sign up)">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="signin()">Log In</button>
<p id="authMessage" class="small"></p>
</div>

<div id="dashboard">
<div class="card">
<h2 id="welcome">Hello!</h2>
<p id="date"></p>
<p id="message">Every sip counts! 💧</p>
<button class="secondary" onclick="logout()">Log Out</button>
</div>

<div class="card">
<h2>Today's Water Intake</h2>
<h2 id="total">0 ml</h2>
<p id="litres">0.00 L</p>
<p id="glasses">0 glasses</p>
<label>Daily goal (ml)</label>
<input id="goal" type="number" value="2000" min="250" onchange="updateDisplay()">
<div class="progress"><div id="progressBar"></div></div>
<p id="percentage">0% completed</p>
<button onclick="addWater(250)">+ 1 Glass (250 ml)</button>
<button onclick="addWater(500)">+ 2 Glasses</button>
<button onclick="addWater(150)">+ 150 ml</button>
<button onclick="addWater(500)">+ 500 ml</button>
<input id="custom" type="number" placeholder="Enter amount in ml">
<button onclick="addCustom()">Add Custom Amount</button>
</div>

<div class="card">
<h2>Today's Drink Log</h2>
<div id="log">No water added yet.</div>
<button class="secondary" onclick="clearToday()">Clear Today's Entries</button>
</div>

<div class="card">
<h2>Weekly Progress</h2>
<div id="week"></div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// Firebase project configuration
const firebaseConfig = {
apiKey: "AIzaSyAyA2vZQEp6vc7xpxMms1JURTAE77V3X4Jwg",
authDomain: "hydrotrack-d5802.firebaseapp.com",
projectId: "hydrotrack-d5802",
storageBucket: "hydrotrack-d5802.firebasestorage.app",
messagingSenderId: "498634741783",
appId: "1:498634741783:web:feb17d16686635606da452"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let entries = [];
let currentUser = null;

const sayings = [
"Every sip counts! Keep going! 💧",
"You're doing amazing! Keep it up! 🌟",
"Small steps make a big difference!",
"Your body deserves care. Keep drinking water!",
"One glass at a time. You've got this! 💙",
"Well done! You're building a healthy habit!",
"Stay hydrated and keep shining! ✨"
];

function todayKey(){
return new Date().toLocaleDateString("en-CA");
}

function showDate(){
document.getElementById("date").textContent =
new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

function showMessage(){
document.getElementById("message").textContent =
sayings[Math.floor(Math.random()*sayings.length)];
}

function userDayRef(){
return db.collection("users").doc(currentUser.uid)
.collection("days").doc(todayKey());
}

async function signup(){
const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
if(!name||!email||!password){
authMessage.textContent="Please fill in your name, email and password.";
return;
}
try{
const result=await auth.createUserWithEmailAndPassword(email,password);
await result.user.updateProfile({displayName:name});
await db.collection("users").doc(result.user.uid).set({name:name,email:email});
await startDashboard(result.user);
}catch(error){
authMessage.textContent=error.message;
}
}

async function signin(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
try{
const result=await auth.signInWithEmailAndPassword(email,password);
await startDashboard(result.user);
}catch(error){
authMessage.textContent=error.message;
}
}

async function logout(){
await auth.signOut();
}

auth.onAuthStateChanged(async user=>{
if(user){
await startDashboard(user);
}else{
currentUser=null;
document.getElementById("login").style.display="block";
document.getElementById("dashboard").style.display="none";
}
});

async function startDashboard(user){
currentUser=user;
document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";
const profile=await db.collection("users").doc(user.uid).get();
const name=profile.exists?profile.data().name:(user.displayName||"there");
document.getElementById("welcome").textContent="Well done, "+name+"! 💙";
showDate();
showMessage();
await loadToday();
await loadWeek();
}

async function loadToday(){
const doc=await userDayRef().get();
entries=doc.exists?(doc.data().entries||[]):[];
updateDisplay();
}

async function saveToday(){
await userDayRef().set({entries:entries});
updateDisplay();
await loadWeek();
}

function getTotal(){
return entries.reduce((sum,item)=>sum+Number(item.amount),0);
}

function updateDisplay(){
const total=getTotal();
const goal=Math.max(1,Number(document.getElementById("goal").value)||2000);
const percent=Math.round(total/goal*100);
document.getElementById("total").textContent=total+" ml";
document.getElementById("litres").textContent=(total/1000).toFixed(2)+" L";
document.getElementById("glasses").textContent=Math.floor(total/250)+" glasses";
document.getElementById("progressBar").style.width=Math.min(percent,100)+"%";
document.getElementById("percentage").textContent=percent+"% completed";
document.getElementById("log").innerHTML=entries.length?
entries.map(item=>"<p>"+item.amount+" ml — "+item.time+"</p>").join(""):"No water added yet.";
}

async function addWater(amount){
entries.push({amount:amount,time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});
await saveToday();
showMessage();
}

async function addCustom(){
const amount=Number(document.getElementById("custom").value);
if(amount<=0||!Number.isFinite(amount)){
alert("Please enter a valid amount.");
return;
}
document.getElementById("custom").value="";
await addWater(amount);
}

async function clearToday(){
if(confirm("Clear all of today's water entries?")){
entries=[];
await saveToday();
}
}

async function loadWeek(){
const area=document.getElementById("week");
area.innerHTML="";
for(let i=6;i>=0;i--){
const date=new Date();
date.setDate(date.getDate()-i);
const key=date.toLocaleDateString("en-CA");
const doc=await db.collection("users").doc(currentUser.uid)
.collection("days").doc(key).get();
const amount=doc.exists?(doc.data().entries||[]).reduce((s,e)=>s+Number(e.amount),0):0;
area.innerHTML+="<p>"+date.toLocaleDateString("en-IN",{weekday:"short",day:"numeric"})+": <b>"+amount+" ml</b></p>";
}
}
</script>
</body>
</html>
